# Run the public guard over every tracked file on each push and pull request.
# CI has no local denylist, so this runs the generic checks; the pre-commit
# hook (scripts/setup-hooks.sh) runs the full set before anything is committed.
name: Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Public guard
        run: python3 -I scripts/public-guard.py --tracked
